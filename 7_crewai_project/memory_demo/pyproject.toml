[project]
name = "memory_demo"
version = "0.1.0"
description = "memory_demo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.0"
]

[project.scripts]
memory_demo = "memory_demo.main:run"
run_crew = "memory_demo.main:run"
train = "memory_demo.main:train"
replay = "memory_demo.main:replay"
test = "memory_demo.main:test"
run_with_trigger = "memory_demo.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
